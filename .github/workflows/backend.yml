name: Backend verification
on:
  pull_request:
    paths: ['api/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: county
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: county_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      COUNTY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/county_test
      COUNTY_TEST_DB_USER: county
      COUNTY_TEST_DB_PASSWORD: test-only
      COUNTY_TEST_SCHEMA: county_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon clean build
