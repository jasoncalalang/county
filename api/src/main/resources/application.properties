# One public hostname: the REST API is served under /api; health and OpenAPI stay under /q.
# Quarkus fixes both paths at build time, so they are set here and cannot come from the chart.
quarkus.http.root-path=/api
quarkus.http.non-application-root-path=/q

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# Dev mode uses a Postgres you already have, not Dev Services (no Docker, ADR 0005).
%dev.quarkus.datasource.jdbc.url=${COUNTY_DEV_JDBC_URL:jdbc:postgresql://localhost:5432/county}
%dev.quarkus.datasource.username=${COUNTY_DEV_DB_USER:county}
%dev.quarkus.datasource.password=${COUNTY_DEV_DB_PASSWORD:county}

# Tests run against the Postgres named by COUNTY_TEST_JDBC_URL. Flyway rebuilds the schema each run.
%test.quarkus.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${COUNTY_TEST_JDBC_URL}
%test.quarkus.datasource.username=${COUNTY_TEST_DB_USER:county}
%test.quarkus.datasource.password=${COUNTY_TEST_DB_PASSWORD:county}
%test.quarkus.flyway.clean-at-start=true
