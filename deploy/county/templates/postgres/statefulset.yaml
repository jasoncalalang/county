{{- $labels := include "county.labels" (dict "root" . "component" "postgres") -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: county-postgres
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: 1
  serviceName: county-postgres
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: county}
            - {name: POSTGRES_USER, value: county}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            {{- include "county.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secret" .Values.secrets.postgres "key" "POSTGRES_PASSWORD") | nindent 12 }}
          startupProbe:
            exec: {command: [pg_isready, -U, county, -d, county]}
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, county, -d, county]}
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [pg_isready, -U, county, -d, county]}
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- $labels | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
