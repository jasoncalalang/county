{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: county
  labels:
    {{- include "county.labels" (dict "root" . "component" "ingress") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ (urlParse (include "county.publicUrl" .)).host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: county-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: county-web
                port:
                  number: 3000
{{- end }}
