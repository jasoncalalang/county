apiVersion: v1
kind: Service
metadata:
  name: county-web
  labels:
    {{- include "county.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  selector:
    {{- include "county.labels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
