{{- if .Values.networkPolicy.enabled }}
{{- $labels := include "county.labels" (dict "root" . "component" "api") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: county-api
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $labels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "county.labels" (dict "root" . "component" "web") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
