{{- if .Values.networkPolicy.enabled }}
{{- $labels := include "county.labels" (dict "root" . "component" "web") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: county-web
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $labels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
