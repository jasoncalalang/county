name: Deploy verification
# Checks the deployment artifacts. It never pushes an image, holds a registry credential or reaches a cluster.
on:
  pull_request:
    paths: ['deploy/**', 'api/**', 'web/**', 'Jenkinsfile', '.dockerignore', '.github/workflows/deploy.yml']
  push:
    branches: [main]
    paths: ['deploy/**', 'api/**', 'web/**', 'Jenkinsfile', '.dockerignore', '.github/workflows/deploy.yml']
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Helm 3.19.0, checksum verified
        run: |
          curl -fsSLo /tmp/helm.tgz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: Lint and render the chart
        run: |
          helm lint deploy/county -f deploy/values/demo.yaml --set-string image.tag=0123456789abcdef0123456789abcdef01234567
      - name: Chart and pipeline tests
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install PyYAML==6.0.3
          /tmp/venv/bin/python -m unittest discover deploy/tests
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Print the digest of the api runtime base image
        run: |
          details="$(docker buildx imagetools inspect registry.access.redhat.com/ubi9/openjdk-21-runtime:1.23)"
          echo "$details" | sed -n '1,4p' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build both images and run them hardened
        run: deploy/tests/smoke.sh
