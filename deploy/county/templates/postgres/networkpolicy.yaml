{{- if .Values.networkPolicy.enabled }}
{{- $labels := include "county.labels" (dict "root" . "component" "postgres") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: county-postgres
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $labels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "county.labels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
