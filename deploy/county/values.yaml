# image.tag and publicUrl are deliberately unset: the render fails without them.
image:
  registry: ghcr.io/jasoncalalang

api:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {memory: 768Mi}

web:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}

postgres:
  image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
  storageClass: longhorn
  size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

# Names of Secrets that already exist in the namespace (ADR 0011). The chart never renders one.
secrets:
  google: county-google
  postgres: county-postgres
  web: county-web
