quarkus.http.root-path=/api
quarkus.http.non-application-root-path=/q
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${COUNTY_JDBC_URL}
quarkus.datasource.username=${COUNTY_DB_USER}
quarkus.datasource.password=${COUNTY_DB_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.oidc.provider=google
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.token.audience=${GOOGLE_CLIENT_ID}
quarkus.http.access-log.enabled=false
quarkus.smallrye-openapi.store-schema-directory=build/openapi
county.public-url=${COUNTY_PUBLIC_URL:http://localhost:3000}
%test.quarkus.datasource.jdbc.url=${COUNTY_TEST_JDBC_URL:jdbc:postgresql://localhost:5432/county_test}
%test.quarkus.datasource.username=${COUNTY_TEST_DB_USER:county}
%test.quarkus.datasource.password=${COUNTY_TEST_DB_PASSWORD:county}
%test.quarkus.datasource.jdbc.max-size=12
%test.quarkus.oidc.enabled=false
%test.quarkus.flyway.schemas=${COUNTY_TEST_SCHEMA:county_test}
%test.quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=${COUNTY_TEST_SCHEMA:county_test}

%test.quarkus.oidc.client-id=county-test
%test.quarkus.oidc.token.audience=county-test
# Auth.js forwards the Google ID token, not an opaque Google access token.
quarkus.oidc.token.verify-access-token-with-user-info=false
quarkus.oidc.authentication.user-info-required=false
quarkus.oidc.token.principal-claim=sub

# OIDC signature warnings can include the rejected bearer token. Keep failures in HTTP status, not logs.
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR

# Keep the generated contract environment-independent; paths already include /api.
mp.openapi.servers=/
